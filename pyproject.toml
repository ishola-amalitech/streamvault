[project]
name = "streamvault"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ishola Faazele", email = "faazele.ishola@amalitech.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
]

[project.scripts]
streamvault = "streamvault.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.6",
]
